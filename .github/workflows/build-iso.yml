name: Build STAR OS ISO
# Desktop OCR and boot screenshot evidence fixes included.
# Rebuild trigger.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'auto/**'
      - 'config/**'
      - 'branding/**'
      - 'build.sh'
      - 'test-qemu.sh'
      - 'tests/**'
      - '.github/workflows/build-iso.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    timeout-minutes: 360
    steps:
      - name: Install Debian 13 build and VM test tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            grub-pc-bin grub-efi-amd64-bin isolinux syslinux-common \
            mtools dosfstools rsync ca-certificates gnupg apt-utils \
            qemu-system-x86 qemu-system-gui ovmf xvfb xauth python3 python3-pil tesseract-ocr
      - uses: actions/checkout@v4
      - name: Set executable permissions
        run: chmod +x auto/config build.sh clean.sh test-qemu.sh config/hooks/normal/*.hook.chroot
      - name: Build hybrid BIOS/UEFI ISO
        run: ./build.sh
      - name: Verify ISO boot catalog and checksum
        run: |
          cd output
          sha256sum -c STAR-1.0-amd64.iso.sha256
          xorriso -indev STAR-1.0-amd64.iso -report_el_torito as_mkisofs
      - name: BIOS and UEFI graphical boot verification (4 GiB)
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a python3 tests/qemu-boot-evidence.py
      - name: Upload boot screenshots and logs even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-boot-evidence
          path: output/boot-evidence/**
          if-no-files-found: warn
          retention-days: 14
      - name: Split ISO into download-safe parts
        shell: bash
        run: |
          set -euo pipefail
          cd output
          split -b 450M -d -a 2 STAR-1.0-amd64.iso STAR-1.0-amd64.iso.part-
          sha256sum STAR-1.0-amd64.iso > STAR-1.0-amd64.iso.full.sha256
          ls -lh STAR-1.0-amd64.iso.part-* STAR-1.0-amd64.iso.full.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-part-01
          path: |
            output/STAR-1.0-amd64.iso.part-00
            output/STAR-1.0-amd64.iso.full.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-part-02
          path: output/STAR-1.0-amd64.iso.part-01
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-part-03
          path: output/STAR-1.0-amd64.iso.part-02
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-part-04
          path: output/STAR-1.0-amd64.iso.part-03
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-part-05
          path: output/STAR-1.0-amd64.iso.part-04
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-part-06
          path: output/STAR-1.0-amd64.iso.part-05
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: STAR-OS-1.0-tests
          path: |
            output/STAR-1.0-amd64.iso.sha256
            output/boot-evidence/**
          if-no-files-found: error
          retention-days: 14
